<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMS Officer Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="login-box">

        <h1>Traffic Incident Management System</h1>

        <h2>Officer Login</h2>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="officer@tims.gov.au"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="demo">
            Demo Login<br><br>

            Email:
            <strong>officer@tims.gov.au</strong>

            <br><br>

            Password:
            <strong>TIMS123</strong>

        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
